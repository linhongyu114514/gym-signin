<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>運動科學實驗室簽到系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* 隱藏滾動條但保留上下滾動功能 */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 確保所有輸入框在深色模式下正常顯示日曆圖示 */
    input[type="date"] {
      color-scheme: dark;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen flex flex-col items-center p-4 landscape:p-2 selection:bg-cyan-500/30">

  <!-- 💡 側邊欄遮罩 (點擊旁邊可關閉) -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden transition-opacity" onclick="closeSidebar()"></div>

  <!-- 💡 左側滑出功能列 (Sidebar) -->
  <div id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-gray-900 border-r border-gray-800 transform -translate-x-full transition-transform duration-300 z-50 shadow-2xl flex flex-col">
    <div class="p-5 border-b border-gray-800 flex justify-between items-center bg-gray-950/50">
      <span class="text-cyan-400 font-bold text-lg flex items-center gap-2"><span class="material-icons">menu_open</span> 系統選單</span>
      <button onclick="closeSidebar()" class="text-gray-400 hover:text-white transition active:scale-90"><span class="material-icons">close</span></button>
    </div>
    <div class="p-4 flex flex-col gap-2 mt-2">
      <!-- 原本的借用人員記錄按鈕移到這裡 -->
      <button onclick="toggleView(); closeSidebar();" class="flex items-center gap-3 text-gray-300 hover:text-cyan-400 p-3 rounded-xl hover:bg-gray-800 transition shadow-sm border border-transparent hover:border-cyan-900/50">
        <span id="toggle-icon-sidebar" class="material-icons text-cyan-500">timeline</span>
        <span id="toggle-text-sidebar" class="font-medium">借用人員記錄</span>
      </button>
      <!-- 新增：回報問題按鈕 -->
      <button onclick="showReportPage(); closeSidebar();" class="flex items-center gap-3 text-gray-300 hover:text-rose-400 p-3 rounded-xl hover:bg-gray-800 transition shadow-sm border border-transparent hover:border-rose-900/50">
        <span class="material-icons text-rose-500">report_problem</span>
        <span class="font-medium">回報問題</span>
      </button>
    </div>
  </div>

  <!-- 💡 修改後的頂部導航列 (改為漢堡按鈕) -->
  <div id="nav-bar" class="hidden w-full max-w-sm landscape:max-w-3xl md:max-w-xl flex justify-between items-center mb-4 px-2 transition-all duration-300">
    <button onclick="openSidebar()" class="flex items-center justify-center bg-gray-900 w-10 h-10 rounded-full border border-gray-700 text-gray-300 transition hover:bg-gray-800 hover:border-cyan-500 hover:text-cyan-400 shadow-lg active:scale-95">
      <span class="material-icons">menu</span>
    </button>
    <span class="text-xs text-cyan-400 font-medium border border-cyan-900/50 bg-cyan-900/20 px-2.5 py-1 rounded-full shadow-inner">運科二簽到系統</span>
  </div>

  <!-- 頁面 1：主頁 (簽到/簽退/綁定) -->
  <div id="page-main" class="w-full max-w-sm bg-gray-900 border border-gray-800 p-6 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.5)] relative mt-4">
    
    <div id="step-bind" class="hidden">
      <h1 class="text-2xl font-bold text-center text-cyan-400 mb-2 flex items-center justify-center gap-2">
        <span class="material-icons text-cyan-500">link</span> 帳號綁定
      </h1>
      <p class="text-gray-400 mb-6 text-center text-sm bg-gray-800/50 p-2 rounded-lg border border-gray-800">初次使用，請綁定您的 Google 帳號與姓名</p>
      <div class="space-y-4">
        <div>
          <label class="block text-gray-300 text-sm font-bold mb-1 flex items-center gap-1"><span class="material-icons text-sm text-gray-400">email</span> Google 帳號 (Email)</label>
          <input type="email" id="input-email" class="w-full p-3 bg-gray-950 text-white border border-gray-700 rounded-xl placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition-all" placeholder="example@gmail.com">
        </div>
        <div>
          <label class="block text-gray-300 text-sm font-bold mb-1 flex items-center gap-1"><span class="material-icons text-sm text-gray-400">badge</span> 真實姓名</label>
          <input type="text" id="input-name" class="w-full p-3 bg-gray-950 text-white border border-gray-700 rounded-xl placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition-all" placeholder="請輸入姓名">
        </div>
        <button onclick="bindAccount()" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 text-white border-none p-3 rounded-xl font-bold text-lg hover:from-blue-500 hover:to-cyan-400 transition-all shadow-[0_0_15px_rgba(6,182,212,0.4)] active:scale-95">完成綁定</button>
      </div>
    </div>

    <div id="step-main" class="hidden flex flex-col items-center">
      <p class="text-lg text-gray-300 mb-6 bg-gray-800/60 border border-gray-700 px-5 py-2 rounded-2xl shadow-inner">哈囉，<span id="display-name" class="font-bold text-cyan-400"></span> 👋</p>
      
      <button id="btn-bubble" onclick="handleBubbleClick()" class="w-48 h-48 rounded-full text-white font-bold text-4xl flex items-center justify-center transition-all transform active:scale-95 duration-300">
      </button>

      <div id="role-selector" class="mt-8 bg-gray-950 border border-gray-800 p-1.5 rounded-xl flex gap-1 w-full justify-center shadow-inner">
        <label class="flex-1 text-center py-2.5 rounded-lg cursor-pointer bg-transparent text-gray-500 hover:text-gray-300 font-medium text-sm transition-all" id="label-role-main">
          <input type="radio" name="role" value="主要借用者" id="radio-main" class="hidden"> 主要借用者
        </label>
        <label class="flex-1 text-center py-2.5 rounded-lg cursor-pointer bg-cyan-600/90 text-white font-bold text-sm shadow-[0_0_10px_rgba(6,182,212,0.5)] transition-all" id="label-role-sub">
          <input type="radio" name="role" value="共同使用者" id="radio-sub" class="hidden" checked> 共同使用者
        </label>
      </div>
    </div>

    <div id="step-device" class="hidden">
      <h2 class="text-xl font-bold text-rose-400 mb-4 text-center flex items-center justify-center gap-1 bg-rose-950/20 py-2 rounded-xl border border-rose-900/50">
        <span class="material-icons text-rose-500">warning_amber</span> 簽退前確認
      </h2>
      <p class="text-gray-400 mb-4 text-center text-sm">您是主要借用者，請選擇您的操作：</p>
      
      <div class="bg-orange-950/30 border border-orange-900/50 p-4 rounded-xl mb-4 shadow-inner">
        <label class="block text-orange-400 text-sm font-bold mb-2 flex items-center gap-1"><span class="material-icons text-sm text-orange-500">swap_horiz</span> 責任交接（指定接替人員）</label>
        <select id="select-next-user" class="w-full p-3 bg-gray-950 text-white border border-gray-700 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 rounded-xl mb-3 outline-none">
          <option value="">-- 請選擇接替的現場人員 --</option>
        </select>
        <button onclick="submitSignOut('轉移')" class="w-full bg-gradient-to-r from-orange-600 to-red-500 text-white p-2.5 rounded-xl font-bold text-sm hover:from-orange-500 hover:to-red-400 transition-all shadow-[0_0_15px_rgba(249,115,22,0.3)] active:scale-95">
          確認將資格轉移離開
        </button>
      </div>

      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-gray-800"></div>
        <span class="flex-shrink-0 mx-4 text-gray-500 text-xs font-bold">或親自關閉設備</span>
        <div class="flex-grow border-t border-gray-800"></div>
      </div>

      <!-- 💡 修改：新的設備檢查項目 -->
      <div class="space-y-2 my-4 bg-gray-950 border border-gray-800 p-4 rounded-xl text-left shadow-inner">
        <label class="flex items-center space-x-3 text-gray-300 p-1.5 cursor-pointer hover:bg-gray-900 rounded-lg transition-colors">
          <input type="checkbox" id="chk-trash" class="w-5 h-5 rounded border-gray-700 bg-gray-900 text-cyan-500 focus:ring-cyan-500 focus:ring-offset-gray-900">
          <span class="flex-1 flex justify-between items-center border-b border-dashed border-gray-700 pb-1">
            <span class="flex items-center gap-1"><span class="material-icons text-sm text-green-400">delete_outline</span> 垃圾清理</span> 
            <b class="font-normal text-green-400 text-xs bg-green-400/10 px-2 py-0.5 rounded">已清理</b>
          </span>
        </label>
        <label class="flex items-center space-x-3 text-gray-300 p-1.5 cursor-pointer hover:bg-gray-900 rounded-lg transition-colors">
          <input type="checkbox" id="chk-ac-light" class="w-5 h-5 rounded border-gray-700 bg-gray-900 text-cyan-500 focus:ring-cyan-500 focus:ring-offset-gray-900">
          <span class="flex-1 flex justify-between items-center border-b border-dashed border-gray-700 pb-1">
            <span class="flex items-center gap-1"><span class="material-icons text-sm text-amber-400">power_settings_new</span> 冷氣電燈</span> 
            <b class="font-normal text-rose-400 text-xs bg-rose-400/10 px-2 py-0.5 rounded">已關閉</b>
          </span>
        </label>
        <label class="flex items-center space-x-3 text-gray-300 p-1.5 cursor-pointer hover:bg-gray-900 rounded-lg transition-colors">
          <input type="checkbox" id="chk-dehumidifier" class="w-5 h-5 rounded border-gray-700 bg-gray-900 text-cyan-500 focus:ring-cyan-500 focus:ring-offset-gray-900">
          <span class="flex-1 flex justify-between items-center border-b border-dashed border-gray-700 pb-1 border-transparent">
            <span class="flex items-center gap-1"><span class="material-icons text-sm text-blue-400">water_drop</span> 除濕機</span> 
            <b class="font-normal text-emerald-400 text-xs bg-emerald-400/10 px-2 py-0.5 rounded">已開啟</b>
          </span>
        </label>
      </div>
      <button onclick="submitSignOut('關閉設備')" class="w-full bg-gradient-to-r from-red-600 to-rose-600 text-white p-3.5 rounded-xl font-bold text-lg hover:from-red-500 hover:to-rose-500 transition-all shadow-[0_0_15px_rgba(225,29,72,0.3)] active:scale-95">確認簽退並離開</button>
    </div>

    <div id="msg" class="hidden mt-4 text-center font-bold text-sm p-2.5 rounded-xl transition-all"></div>
  </div>

  <!-- 💡 頁面 2：新增的問題回報頁面 -->
  <div id="page-report" class="hidden w-full max-w-sm bg-gray-900 border border-gray-800 p-6 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.5)] relative mt-4">
    <h2 class="text-xl font-bold text-rose-400 mb-4 flex items-center justify-center gap-2 border-b border-gray-800 pb-4">
      <span class="material-icons">report_problem</span> 問題回報
    </h2>
    <p class="text-gray-400 mb-4 text-sm bg-gray-800/50 p-3 rounded-lg border border-gray-800">
      如果您發現設備損壞、環境髒亂或其他異常情況，請在此描述並送出。
    </p>
    <textarea id="input-issue" rows="5" class="w-full p-3 bg-gray-950 text-white border border-gray-700 rounded-xl focus:border-rose-500 focus:ring-1 focus:ring-rose-500 outline-none mb-5" placeholder="請詳細描述您遇到的問題..."></textarea>
    <div class="flex gap-3">
      <button onclick="hideReportPage()" class="flex-1 bg-gray-800 text-gray-300 p-3 rounded-xl font-bold hover:bg-gray-700 transition active:scale-95 border border-gray-700">返回</button>
      <button onclick="submitReport()" class="flex-[2] bg-gradient-to-r from-rose-600 to-red-600 text-white p-3 rounded-xl font-bold shadow-lg hover:from-rose-500 hover:to-red-500 transition active:scale-95">送出回報</button>
    </div>
  </div>

  <!-- 頁面 3：時間軸頁面 -->
  <div id="page-timeline" class="hidden w-full max-w-sm landscape:max-w-3xl md:max-w-xl bg-gray-900 p-5 rounded-3xl border border-gray-800 mt-4 shadow-[0_8px_30px_rgb(0,0,0,0.5)] transition-all duration-300">
    
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-sm font-bold text-cyan-400 flex items-center shrink-0 bg-gray-800/50 border border-gray-700 px-3 py-1.5 rounded-lg shadow-inner gap-1.5">
        <span class="material-icons text-cyan-500 text-sm">insert_chart_outlined</span> 請將手機轉成橫的
      </h2>
      <input type="date" id="report-date" class="bg-gray-950 text-gray-200 p-1.5 rounded-xl border border-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 shrink-0 w-[125px] text-center shadow-inner cursor-pointer">
    </div>
    
    <div class="flex justify-center mb-5 w-full">
      <div class="flex items-center justify-center bg-gray-950 border border-gray-800 rounded-xl shrink-0 p-1 shadow-inner">
        <button onclick="changeDate(-1)" class="w-9 h-9 flex items-center justify-center text-gray-400 hover:text-cyan-400 hover:bg-gray-800 rounded-lg transition active:scale-90">
          <span class="material-icons text-xl">chevron_left</span>
        </button>
        <span id="display-current-date" class="px-3 text-sm font-bold text-gray-200 min-w-[110px] text-center tracking-widest whitespace-nowrap"></span>
        <button onclick="changeDate(1)" class="w-9 h-9 flex items-center justify-center text-gray-400 hover:text-cyan-400 hover:bg-gray-800 rounded-lg transition active:scale-90">
          <span class="material-icons text-xl">chevron_right</span>
        </button>
      </div>
    </div>

    <div class="relative rounded-2xl border border-gray-800 bg-gray-950 shadow-inner p-2">
      <div id="no-data" class="hidden absolute inset-0 flex items-center justify-center text-gray-400 text-sm font-bold bg-gray-950/90 rounded-2xl z-10 pointer-events-none backdrop-blur-sm">
        <div class="flex flex-col items-center gap-2">
          <span class="material-icons text-gray-500 text-3xl">inbox</span>
          <span>該日期沒有任何進出紀錄</span>
        </div>
      </div>
      <div id="chart-scroll-area" class="h-[400px] landscape:h-[260px] w-full overflow-y-auto overflow-x-hidden rounded-xl hide-scrollbar scroll-smooth relative touch-pan-y">
        <div id="chart-container" class="relative w-full" style="height: 100%;">
          <canvas id="timeChart"></canvas>
        </div>
      </div>
    </div>
    
    <div class="text-center text-xs text-gray-500 mt-4 flex flex-col items-center justify-center gap-1.5">
      <span class="flex items-center gap-1.5 bg-gray-800/40 px-3 py-1 rounded-full"><span class="material-icons text-sm text-cyan-500">touch_app</span> 點擊圖表長條色塊可查看詳細資訊</span>
      <span class="flex items-center gap-1.5 bg-gray-800/40 px-3 py-1 rounded-full mt-0.5"><span class="material-icons text-sm text-cyan-500">swipe_up</span> 上下滑動圖表可檢視人員名單</span>
    </div>
  </div>

  <div id="custom-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center p-4 z-50 transition-opacity duration-300">
    <div class="w-full max-w-xs bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-2xl transform scale-95 transition-transform duration-300">
      <div class="flex items-center gap-2 border-b border-gray-800 pb-2 mb-3">
        <span id="modal-icon" class="material-icons text-cyan-400">info_outline</span>
        <h3 class="text-base font-bold text-gray-100 tracking-wider">系統訊息</h3>
      </div>
      <div id="modal-body" class="text-sm text-gray-300 space-y-1.5 leading-relaxed py-1">
      </div>
      <button onclick="closeModal()" class="mt-4 w-full bg-gray-800 text-gray-200 border border-gray-700 py-2 rounded-xl font-medium text-sm hover:bg-gray-700 active:scale-95 transition-all">
        確認
      </button>
    </div>
  </div>

  <script>
    // =================【請貼上你的 GAS Web App URL】=================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz5N0iuhQZSvxARW8tv8sPHmlGhy4PiC3KSJe73ahtR04aBhdHYMTz9BhbFeRQrPC-6/exec";
    // ===========================================================================

    let myChart = null;
    let currentView = 'main';
    let currentFetchToken = 0; 

    // 💡 側邊欄開關控制
    function openSidebar() {
      document.getElementById('sidebar').classList.remove('-translate-x-full');
      document.getElementById('sidebar-overlay').classList.remove('hidden');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('sidebar-overlay').classList.add('hidden');
    }

    function showModal(htmlContent, theme = 'cyan') {
      const modal = document.getElementById('custom-modal');
      const icon = document.getElementById('modal-icon');
      document.getElementById('modal-body').innerHTML = htmlContent;
      
      if (theme === 'yellow') {
        icon.innerText = "warning";
        icon.className = "material-icons text-amber-400";
      } else if (theme === 'red') {
        icon.innerText = "error_outline";
        icon.className = "material-icons text-rose-500";
      } else {
        icon.innerText = "info_outline";
        icon.className = "material-icons text-cyan-400";
      }
      modal.classList.remove('hidden');
    }
    
    function closeModal() { document.getElementById('custom-modal').classList.add('hidden'); }

    document.addEventListener('change', function(e) {
      if (e.target && e.target.name === 'role') {
        var labelMain = document.getElementById('label-role-main');
        var labelSub = document.getElementById('label-role-sub');
        if (e.target.value === '主要借用者') {
          labelMain.className = "flex-1 text-center py-2.5 rounded-lg cursor-pointer bg-cyan-600/90 text-white font-bold text-sm shadow-[0_0_10px_rgba(6,182,212,0.5)] transition-all";
          labelSub.className = "flex-1 text-center py-2.5 rounded-lg cursor-pointer bg-transparent text-gray-500 hover:text-gray-300 font-medium text-sm transition-all";
        } else {
          labelSub.className = "flex-1 text-center py-2.5 rounded-lg cursor-pointer bg-cyan-600/90 text-white font-bold text-sm shadow-[0_0_10px_rgba(6,182,212,0.5)] transition-all";
          labelMain.className = "flex-1 text-center py-2.5 rounded-lg cursor-pointer bg-transparent text-gray-500 hover:text-gray-300 font-medium text-sm transition-all";
        }
      }
    });

    window.onload = function() {
      var savedEmail = localStorage.getItem('gym_email');
      var savedName = localStorage.getItem('gym_username');
      
      const today = new Date();
      const todayStr = today.getFullYear() + "-" + ("0" + (today.getMonth() + 1)).slice(-2) + "-" + ("0" + today.getDate()).slice(-2);
      
      document.getElementById('report-date').value = todayStr;
      document.getElementById('display-current-date').innerText = todayStr;
      
      document.getElementById('report-date').addEventListener('change', function(e) { 
        document.getElementById('display-current-date').innerText = e.target.value;
        fetchAndRenderChart(e.target.value); 
      });

      if (!savedEmail || !savedName) {
        document.getElementById('step-bind').classList.remove('hidden');
      } else {
        document.getElementById('nav-bar').classList.remove('hidden');
        showMainPage(savedName);
      }
    };

    function changeDate(offset) {
      const dateInput = document.getElementById('report-date');
      if (!dateInput.value) return;
      const parts = dateInput.value.split('-');
      let currentDate = new Date(parts[0], parts[1] - 1, parts[2]);
      currentDate.setDate(currentDate.getDate() + offset);
      const newDateStr = currentDate.getFullYear() + "-" + 
                         ("0" + (currentDate.getMonth() + 1)).slice(-2) + "-" + 
                         ("0" + currentDate.getDate()).slice(-2);
      dateInput.value = newDateStr;
      document.getElementById('display-current-date').innerText = newDateStr;
      fetchAndRenderChart(newDateStr);
    }

    // 💡 控制頁面跳轉邏輯
    function toggleView() {
      const pageMain = document.getElementById('page-main');
      const pageTimeline = document.getElementById('page-timeline');
      const pageReport = document.getElementById('page-report');
      const toggleIcon = document.getElementById('toggle-icon-sidebar');
      const toggleText = document.getElementById('toggle-text-sidebar');

      if (currentView !== 'timeline') {
        currentView = 'timeline';
        pageMain.classList.add('hidden');
        pageReport.classList.add('hidden');
        pageTimeline.classList.remove('hidden');
        toggleIcon.innerText = 'home';
        toggleText.innerText = '返回首頁';
        fetchAndRenderChart(document.getElementById('report-date').value);
      } else {
        currentView = 'main';
        pageTimeline.classList.add('hidden');
        pageReport.classList.add('hidden');
        pageMain.classList.remove('hidden');
        toggleIcon.innerText = 'timeline';
        toggleText.innerText = '借用人員記錄';
      }
    }

    // 💡 顯示問題回報頁面
    function showReportPage() {
      currentView = 'report';
      document.getElementById('page-main').classList.add('hidden');
      document.getElementById('page-timeline').classList.add('hidden');
      document.getElementById('page-report').classList.remove('hidden');
      // 將側邊欄的按鈕文字切換為可回首頁
      document.getElementById('toggle-icon-sidebar').innerText = 'home';
      document.getElementById('toggle-text-sidebar').innerText = '返回首頁';
    }

    // 💡 隱藏問題回報頁面，回到首頁
    function hideReportPage() {
      currentView = 'main';
      document.getElementById('page-report').classList.add('hidden');
      document.getElementById('page-main').classList.remove('hidden');
      document.getElementById('toggle-icon-sidebar').innerText = 'timeline';
      document.getElementById('toggle-text-sidebar').innerText = '借用人員記錄';
    }

    // 💡 送出問題回報
    function submitReport() {
      const issueText = document.getElementById('input-issue').value.trim();
      if (!issueText) {
        alert("請輸入問題描述！");
        return;
      }
      
      showLoading("回報提交中...");
      var name = localStorage.getItem('gym_username');
      var email = localStorage.getItem('gym_email');

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "回報問題", name: name, email: email, issue: issueText })
      })
      .then(res => res.json())
      .then(() => {
        showSuccess("回報已送出！感謝您的協助 🙌");
        setTimeout(() => {
          hideLoading();
          document.getElementById('input-issue').value = ''; // 清空輸入框
          hideReportPage(); // 自動回到首頁
        }, 2000);
      })
      .catch(err => {
        alert("連線失敗，請重試");
        hideLoading();
      });
    }

    function bindAccount() {
      var email = document.getElementById('input-email').value.trim();
      var name = document.getElementById('input-name').value.trim();
      if (!email || !name) { alert('請填寫完整資訊！'); return; }
      
      localStorage.setItem('gym_email', email);
      localStorage.setItem('gym_username', name);
      localStorage.setItem('gym_status', 'checked_out'); 
      
      document.getElementById('nav-bar').classList.remove('hidden');
      document.getElementById('step-bind').classList.add('hidden');
      showMainPage(name);
    }

    function showMainPage(name) {
      document.getElementById('step-main').classList.remove('hidden');
      document.getElementById('display-name').innerText = name;
      updateBubbleUI();
    }

    function updateBubbleUI() {
      var status = localStorage.getItem('gym_status') || 'checked_out';
      var bubble = document.getElementById('btn-bubble');
      var roleSelector = document.getElementById('role-selector');

      if (status === 'checked_out') {
        bubble.innerText = "簽到";
        bubble.className = "w-52 h-52 rounded-full text-white font-black text-5xl flex items-center justify-center transition-all transform active:scale-95 duration-200 bg-gradient-to-br from-emerald-400 to-emerald-700 shadow-[0_0_40px_rgba(16,185,129,0.3)] border-[6px] border-gray-900 hover:shadow-[0_0_50px_rgba(16,185,129,0.5)] cursor-pointer";
        roleSelector.style.opacity = "1";
        roleSelector.style.pointerEvents = "auto";
      } else {
        bubble.innerText = "簽退";
        bubble.className = "w-52 h-52 rounded-full text-white font-black text-5xl flex items-center justify-center transition-all transform active:scale-95 duration-200 bg-gradient-to-br from-rose-500 to-rose-800 shadow-[0_0_40px_rgba(225,29,72,0.3)] border-[6px] border-gray-900 hover:shadow-[0_0_50px_rgba(225,29,72,0.5)] cursor-pointer";
        roleSelector.style.opacity = "0.5";
        roleSelector.style.pointerEvents = "none";
      }
    }

    function handleBubbleClick() {
      var status = localStorage.getItem('gym_status') || 'checked_out';
      if (status === 'checked_out') { processCheckIn(); } 
      else { processPreCheckOut(); }
    }

    function processCheckIn() {
      var name = localStorage.getItem('gym_username');
      var email = localStorage.getItem('gym_email');
      var role = document.querySelector('input[name="role"]:checked').value;
      var bubble = document.getElementById('btn-bubble');
      bubble.innerText = "處理中";

      var payload = { action: '簽到', name: name, email: email, role: role };

      fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) })
      .then(res => res.json())
      .then(() => {
        bubble.innerText = "簽到成功";
        localStorage.setItem('gym_status', 'checked_in');
        localStorage.setItem('gym_current_role', role); 
        setTimeout(updateBubbleUI, 1500);
      })
      .catch(err => { alert("連線失敗"); updateBubbleUI(); });
    }

    function processPreCheckOut() {
      var name = localStorage.getItem('gym_username');
      var bubble = document.getElementById('btn-bubble');
      bubble.innerText = "驗證中";
      showLoading("正在驗證身份與交接狀態...");
      
      fetch(GAS_URL, { 
        method: "POST", 
        body: JSON.stringify({ action: "檢查目前身分", name: name }) 
      })
      .then(res => res.json())
      .then(response => {
        var latestRole = response.role || '共同使用者';
        localStorage.setItem('gym_current_role', latestRole); 
        
        if (latestRole === '主要借用者') {
          showLoading("正在撈取名單...");
          fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "取得在場名單", excludeName: name }) })
          .then(res => res.json())
          .then(resList => {
            hideLoading();
            bubble.innerText = "簽退";
            
            var select = document.getElementById('select-next-user');
            select.innerHTML = '<option value="">-- 請選擇接替的現場人員 --</option>'; 
            if (resList.users && resList.users.length > 0) {
              resList.users.forEach(function(username) {
                var opt = document.createElement('option');
                opt.value = username;
                opt.innerText = username;
                select.appendChild(opt);
              });
            }
            document.getElementById('step-main').classList.add('hidden');
            document.getElementById('step-device').classList.remove('hidden');
          });
        } else {
          hideLoading();
          bubble.innerText = "處理中";
          var payload = { action: '簽退', name: name, email: localStorage.getItem('gym_email'), role: '共同使用者' };
          fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) })
          .then(() => {
            bubble.innerText = "簽退成功";
            localStorage.setItem('gym_status', 'checked_out');
            setTimeout(updateBubbleUI, 1500);
          });
        }
      })
      .catch(err => {
        alert("網路連線逾時，請重試");
        bubble.innerText = "簽退";
        hideLoading();
      });
    }

    function submitSignOut(mode) {
      var name = localStorage.getItem('gym_username');
      var payload = { action: '簽退', name: name, email: localStorage.getItem('gym_email'), role: '主要借用者' };

      if (mode === '轉移') {
        var nextUser = document.getElementById('select-next-user').value;
        if (!nextUser) { alert('請選擇現場接替人員！若無人，請走下方親自確認設備流程。'); return; }
        payload.transferTo = nextUser; 
      } else {
        // 💡 修改驗證的新設備 checkbox
        var isTrashChecked = document.getElementById('chk-trash').checked;
        var isAcLightChecked = document.getElementById('chk-ac-light').checked;
        var isDehChecked = document.getElementById('chk-dehumidifier').checked;
        if (!isTrashChecked || !isAcLightChecked || !isDehChecked) {
          alert('請確實檢查垃圾已清理、冷氣電燈已關閉，除濕機已開啟！');
          return;
        }
        payload.trashCheck = "已清理";
        payload.acLightCheck = "已關閉";
        payload.dehumidifierCheck = "已開啟";
      }

      showLoading("記錄中...");
      fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) })
      .then(res => res.json())
      .then(() => {
        localStorage.setItem('gym_status', 'checked_out');
        showSuccess("👋 簽退成功！掰噗！👋");
        setTimeout(() => {
          hideLoading();
          document.getElementById('step-device').classList.add('hidden');
          document.getElementById('step-main').classList.remove('hidden');
          document.getElementById('chk-trash').checked = false;
          document.getElementById('chk-ac-light').checked = false;
          document.getElementById('chk-dehumidifier').checked = false;
          updateBubbleUI();
        }, 2000);
      });
    }

    function fetchAndRenderChart(dateStr) {
      const noDataHint = document.getElementById('no-data');
      if (myChart) { myChart.destroy(); myChart = null; }
      noDataHint.classList.add('hidden');
      
      const fetchToken = ++currentFetchToken;

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "取得報表圖表", date: dateStr })
      })
      .then(res => res.json())
      .then(data => {
        if (currentFetchToken !== fetchToken) return; 
        renderChart(data);
      })
      .catch(err => {
        if (currentFetchToken !== fetchToken) return; 
        noDataHint.classList.remove('hidden');
      });
    }

    function renderChart(data) {
      const names = Object.keys(data);
      const ctx = document.getElementById('timeChart').getContext('2d');
      const noDataHint = document.getElementById('no-data');
      const chartContainer = document.getElementById('chart-container');
      const chartScrollArea = document.getElementById('chart-scroll-area');

      noDataHint.classList.add('hidden');

      if (names.length === 0) {
        noDataHint.classList.remove('hidden');
        return;
      }

      const requiredHeight = Math.max(names.length * 50 + 60, chartScrollArea.clientHeight);
      chartContainer.style.height = requiredHeight + 'px';

      const chartData = [];
      const bgColors = [];

      names.forEach(name => {
        data[name].forEach(record => {
          const isForcedCheckout = (record.end >= 1439);
          const finalEndValue = isForcedCheckout ? 1440 : record.end;
          const duration = finalEndValue - record.start;

          chartData.push({
            y: name,
            x: [record.start, finalEndValue],
            startLabel: record.startLabel,
            endLabel: isForcedCheckout ? "24:00" : record.endLabel,
            duration: duration,
            isForcedCheckout: isForcedCheckout 
          });
          
          if (isForcedCheckout) {
            bgColors.push('rgba(234, 179, 8, 0.9)'); 
          } else if (duration > 120) {
            bgColors.push('rgba(239, 68, 68, 0.9)'); 
          } else {
            bgColors.push('rgba(6, 182, 212, 0.85)'); 
          }
        });
      });

      myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          datasets: [{
            data: chartData,
            backgroundColor: bgColors,
            borderColor: '#111827', 
            borderWidth: 2,
            borderRadius: 6,
            borderSkipped: false,
            barPercentage: 0.65 
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          onClick: (e, activeElements, chart) => {
            if (activeElements.length > 0) {
              const index = activeElements[0].index;
              const record = chart.data.datasets[0].data[index];
              const duration = record.duration; 
              
              let htmlContent = `
                <div class="font-bold text-cyan-400 text-base mb-1">👤 ${record.y}</div>
                <div>🛫 簽到：${record.startLabel}</div>
                <div>🛬 簽退：${record.endLabel}</div>
                <div>⏳ 時長：${Math.floor(duration/60)} 小時 ${duration%60} 分鐘</div>
              `;
              
              let theme = 'cyan';
              if (record.isForcedCheckout) {
                theme = 'yellow';
                htmlContent += `<div class="text-amber-400 mt-2 font-bold flex items-center gap-1"><span class="material-icons text-sm">error</span> 狀況：忘記簽退，已由系統強制簽退，請管理人員確認CCTV</div>`;
              } else if (duration > 120) {
                theme = 'red';
                htmlContent += `<div class="text-rose-400 mt-2 font-bold flex items-center gap-1"><span class="material-icons text-sm">report_problem</span> 狀況：單純續借、或超時、或忘記簽退，請管理人員確認Google月曆及CCTV</div>`;
              }
              
              showModal(htmlContent, theme);
            }
          },
          layout: { padding: { left: 5, right: 15, top: 10, bottom: 10 } },
          scales: {
            x: {
              min: 0, max: 1440,
              ticks: { 
                stepSize: 60, 
                callback: value => {
                  let h = Math.floor(value / 60);
                  let displayHour = h > 24 ? h - 24 : h;
                  return ("0" + displayHour).slice(-2) + ":00";
                }, 
                color: '#9CA3AF', font: { size: 9 }, autoSkip: false, maxRotation: 45, minRotation: 0
              },
              grid: { color: 'rgba(255, 255, 255, 0.05)' } 
            },
            y: { 
              ticks: { color: '#E5E7EB', font: { size: 13, weight: 'bold' } }, 
              grid: { display: false } 
            }
          },
          plugins: { legend: { display: false }, tooltip: { enabled: false } }
        }
      });
    }

    function showLoading(txt) {
      document.getElementById('msg').innerText = txt;
      document.getElementById('msg').className = "mt-4 text-center font-bold text-sm text-cyan-400 bg-gray-900/50 p-2.5 rounded-xl border border-cyan-900";
      document.getElementById('msg').classList.remove('hidden');
    }
    function hideLoading() { 
      document.getElementById('msg').innerText = ""; 
      document.getElementById('msg').classList.add('hidden');
    }
    function showSuccess(txt) {
      document.getElementById('msg').innerText = txt;
      document.getElementById('msg').className = "mt-4 text-center font-bold text-md text-emerald-400 bg-emerald-950/30 p-2.5 rounded-xl border border-emerald-900/50 shadow-inner";
      document.getElementById('msg').classList.remove('hidden');
    }
  </script>
</body>
